name: Build DRIVORA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm ci

      - name: Create Android project
        run: npx cap add android

      - name: Add OBD link, permissions and signing key
        run: node tools/android-patch.js

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DRIVORA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DRIVORA-apk
          path: DRIVORA.apk
